server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The load balancer's login token (x-amzn-oidc-data) is a large header.
  large_client_header_buffers 4 32k;
  # GitHub webhook payloads; the api enforces its own 5 MB limit.
  client_max_body_size 6m;

  # The page must always be revalidated, or a browser keeps showing the previous build.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Bundles carry a content hash in their name, so they never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # API responses: the api sets no-store, nosniff, a referrer policy and a deny-all
  # content policy itself (main._API_HEADERS). nginx adds only what the api does not,
  # so no header is sent twice.
  location /api/ {
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
  }
}
