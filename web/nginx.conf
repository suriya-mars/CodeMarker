server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  # The page must always be revalidated, or a browser keeps showing the previous build.
  # Bundles in /assets carry a content hash in their name, so they can be cached freely.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the FastAPI service (compose service name: api)
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }
}
