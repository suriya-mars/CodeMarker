# Security headers for every response nginx sends. Included in EACH location block:
# in nginx, any add_header inside a location silently drops all headers set outside
# it, so a shared file is the only way to keep them from drifting apart.
#
# The page shows repository text. Nothing it renders may load or run anything from
# elsewhere: scripts, styles, fonts and requests all stay on this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Ignored over plain http (local), honoured behind the HTTPS load balancer.
add_header Strict-Transport-Security "max-age=31536000" always;
