services:
  neo4j:
    image: neo4j:5-community
    ports:
      # Bound to localhost only: reachable from this machine (browser UI, the
      # per-engineer MCP server) but never from the network. The api reaches
      # Neo4j over the compose network and needs no published port at all.
      - "127.0.0.1:7474:7474"   # browser UI
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      # Sized for bulk indexing of a large codebase. 1G was not enough: writing
      # ~125k symbols with their source, plus building the full-text index,
      # pushes the heap hard. Page cache keeps the hot graph resident so
      # traversals (blast radius, HANDLES hops) stay fast.
      # Tune down for small repos or a memory-constrained host.
      # initial == max on purpose: Neo4j recommends it to avoid heap-resize pauses
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-4G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-4G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      LLM_PROVIDER: "${LLM_PROVIDER:-anthropic}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      # auth.py: none (local dev) | token | alb (production behind an AWS ALB)
      AUTH_MODE: "${AUTH_MODE:-none}"
      API_TOKEN: "${API_TOKEN:-}"
      ALB_ARN: "${ALB_ARN:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"   # empty = no cross-origin access
      MAX_FILE_BYTES: "${MAX_FILE_BYTES:-1000000}"  # larger files are skipped, not parsed
      LLM_RATE_PER_MIN: "${LLM_RATE_PER_MIN:-20}"   # per user, on routes that call the LLM
      DAILY_TOKEN_QUOTA: "${DAILY_TOKEN_QUOTA:-2000000}"   # per user per UTC day, stored in Neo4j
      AGENT_TOKEN_BUDGET: "${AGENT_TOKEN_BUDGET:-150000}"  # per question, input + output
      AGENT_TIMEOUT_S: "${AGENT_TIMEOUT_S:-120}"            # per question, wall clock
      LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-60}"                 # per provider call
      MAX_QUESTION_CHARS: "${MAX_QUESTION_CHARS:-4000}"
      REPOS_ROOT: "/repos"
    volumes:
      - ./api:/app
      - ./repos:/repos:ro          # target codebases, read-only
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # Indexed repos are untrusted input parsed by native code (tree-sitter).
    # Contain a hostile file: no privilege escalation, no Linux capabilities,
    # bounded memory and process count. Network egress (LLM API only) is
    # enforced by the host / AWS security group, not here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: "${API_MEM_LIMIT:-8g}"
    pids_limit: 512

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  neo4j-data:
