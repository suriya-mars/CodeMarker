services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-change-me}"
      # Sized for bulk indexing of a large codebase. 1G was not enough: writing
      # ~125k symbols with their source, plus building the full-text index,
      # pushes the heap hard. Page cache keeps the hot graph resident so
      # traversals (blast radius, HANDLES hops) stay fast.
      # Tune down for small repos or a memory-constrained host.
      # initial == max on purpose: Neo4j recommends it to avoid heap-resize pauses
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-4G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-4G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-change-me}"
      LLM_PROVIDER: "${LLM_PROVIDER:-anthropic}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
    volumes:
      - ./api:/app
      - ./repos:/repos:ro          # target codebases, read-only
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  neo4j-data:
