services:
  neo4j:
    image: neo4j:5-community
    ports:
      # Bound to localhost only: reachable from this machine (browser UI, the
      # per-engineer MCP server) but never from the network. The api reaches
      # Neo4j over the compose network and needs no published port at all.
      - "127.0.0.1:7474:7474"   # browser UI
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      # Sized for bulk indexing of a large codebase. 1G was not enough: writing
      # ~125k symbols with their source, plus building the full-text index,
      # pushes the heap hard. Page cache keeps the hot graph resident so
      # traversals (blast radius, HANDLES hops) stay fast.
      # Tune down for small repos or a memory-constrained host.
      # initial == max on purpose: Neo4j recommends it to avoid heap-resize pauses
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-4G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-4G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
      # Neo4j reports anonymous usage data to Neo4j by default. Nothing leaves this stack
      # except the LLM call (CLAUDE.md §2.3), so it is off.
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      LLM_PROVIDER: "${LLM_PROVIDER:-anthropic}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      # auth.py: none (local dev) | token | alb (production behind an AWS ALB)
      AUTH_MODE: "${AUTH_MODE:-none}"
      API_TOKEN: "${API_TOKEN:-}"
      ALB_ARN: "${ALB_ARN:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"   # empty = no cross-origin access
      MAX_FILE_BYTES: "${MAX_FILE_BYTES:-1000000}"  # larger files are skipped, not parsed
      INDEX_SKIP_GENERATED: "${INDEX_SKIP_GENERATED:-1}"  # parsing/__init__.py: skip generated code
      INDEX_EXCLUDE: "${INDEX_EXCLUDE:-}"                # extra globs to leave out
      LLM_RATE_PER_MIN: "${LLM_RATE_PER_MIN:-20}"   # per user, on routes that call the LLM
      DAILY_TOKEN_QUOTA: "${DAILY_TOKEN_QUOTA:-2000000}"   # per user per UTC day, stored in Neo4j
      AGENT_TOKEN_BUDGET: "${AGENT_TOKEN_BUDGET:-150000}"  # per question, input + output
      AGENT_TIMEOUT_S: "${AGENT_TIMEOUT_S:-120}"            # per question, wall clock
      LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-60}"                 # per provider call
      MAX_QUESTION_CHARS: "${MAX_QUESTION_CHARS:-4000}"
      # guard.py: local ML guardrails (LLM Guard). required = refuse to start without them.
      GUARD_MODE: "${GUARD_MODE:-required}"
      GUARD_THRESHOLD: "${GUARD_THRESHOLD:-0.99}"
      REPOS_ROOT: "/repos"
      USAGE_RETENTION_DAYS: "${USAGE_RETENTION_DAYS:-400}"   # quota.py: usage records hold emails
      # sessions.py: remembered conversations
      SESSION_MAX_TURNS: "${SESSION_MAX_TURNS:-10}"
      SESSION_MAX_HISTORY_CHARS: "${SESSION_MAX_HISTORY_CHARS:-32000}"
      SESSION_RETENTION_DAYS: "${SESSION_RETENTION_DAYS:-30}"
      # repo_jobs.py: repositories added by URL in the Repos tab
      CLONE_ROOT: "/clones"
      CLONE_ALLOWED_HOSTS: "${CLONE_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}"
      CLONE_MAX_MB: "${CLONE_MAX_MB:-1000}"
      INDEX_MAX_SYMBOLS: "${INDEX_MAX_SYMBOLS:-50000}"
      CLONE_TOKEN: "${CLONE_TOKEN:-}"
      CLONE_TOKEN_HOST: "${CLONE_TOKEN_HOST:-github.com}"
      # pr_review.py: comment on pull requests. Off unless the webhook secret is set.
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      GITHUB_REPOS: "${GITHUB_REPOS:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_PR_FORKS: "${GITHUB_PR_FORKS:-0}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
    volumes:
      - ./api:/app
      - ./repos:/repos:ro          # target codebases, read-only
      - pr-mirrors:/mirrors        # git history fetched for pull request review
      - cloned-repos:/clones       # repositories added by URL
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # Indexed repos are untrusted input parsed by native code (tree-sitter).
    # Contain a hostile file: no privilege escalation, no Linux capabilities,
    # bounded memory and process count. Network egress (LLM API only) is
    # enforced by the host / AWS security group, not here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: "${API_MEM_LIMIT:-8g}"
    pids_limit: 512

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  neo4j-data:
  pr-mirrors:
  cloned-repos:
